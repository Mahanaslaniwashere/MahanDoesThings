<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">استقرار روی شیب؛ طراحی از مقطع</title><desc id="desc">مقطع شماتیک سه سکوی فرضی؛ رنگ آجری خاک‌برداری و رنگ اُخرایی خاک‌ریزی نسبت به خط‌چین زمین اولیه را جدا می‌کنند. شکل، مقطع واقعی یا محاسبه حجم خاک نیست.</desc><defs><marker id="214f43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#214f43"/></marker><marker id="86a18a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#86a18a"/></marker><marker id="cc9a43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#cc9a43"/></marker><marker id="43859a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#43859a"/></marker><marker id="b97154" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b97154"/></marker><marker id="98748d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#98748d"/></marker></defs><rect x="0" y="0" width="900" height="650" rx="0" fill="#faf8f0" stroke="none" stroke-width="2"/><text x="450" y="45" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="28" fill="#23483f">استقرار روی شیب؛ طراحی از مقطع</text><text x="450" y="77" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#6d7c6e">خاک‌برداری و خاک‌ریزی تابع تراز پیشنهادی‌اند</text><rect x="35" y="105" width="830" height="405" rx="16" fill="#ffffff" stroke="#dde3d6" stroke-width="2"/><text x="450" y="143" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="23" fill="#23483f">مقطعِ یک استقرار پله‌ایِ فرضی</text><path d="M80,254 L820,477 L820,510 L80,510 Z" stroke="#d8d2bb" stroke-width="0" fill="#e8e3d2" stroke-linecap="round" stroke-linejoin="round" /><path d="M90,254 L290,254 L290,325 L490,325 L490,395 L690,395 L690,470 L820,470" stroke="#214f43" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M90,254 L290,254 L290,317 Z" stroke="#b97154" stroke-width="0" fill="#e4c578" stroke-linecap="round" stroke-linejoin="round" /><path d="M290,317 L290,325 L316,325 Z" stroke="#cc9a43" stroke-width="0" fill="#d9b29c" stroke-linecap="round" stroke-linejoin="round" /><path d="M316,325 L490,325 L490,377 Z" stroke="#b97154" stroke-width="0" fill="#e4c578" stroke-linecap="round" stroke-linejoin="round" /><path d="M490,377 L490,395 L550,395 Z" stroke="#cc9a43" stroke-width="0" fill="#d9b29c" stroke-linecap="round" stroke-linejoin="round" /><path d="M550,395 L690,395 L690,438 Z" stroke="#b97154" stroke-width="0" fill="#e4c578" stroke-linecap="round" stroke-linejoin="round" /><path d="M690,438 L690,470 L797,470 Z" stroke="#cc9a43" stroke-width="0" fill="#d9b29c" stroke-linecap="round" stroke-linejoin="round" /><path d="M80,254 L820,477" stroke="#847b64" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><rect x="135" y="196" width="100" height="58" rx="0" fill="#f7f5e9" stroke="#214f43" stroke-width="2"/><path d="M131,196 H239" stroke="#214f43" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M142,201 V251 M228,201 V251" stroke="#b7c7b0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="340" y="267" width="100" height="58" rx="0" fill="#f7f5e9" stroke="#214f43" stroke-width="2"/><path d="M336,267 H444" stroke="#214f43" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M347,272 V322 M433,272 V322" stroke="#b7c7b0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="540" y="337" width="100" height="58" rx="0" fill="#f7f5e9" stroke="#214f43" stroke-width="2"/><path d="M536,337 H644" stroke="#214f43" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M547,342 V392 M633,342 V392" stroke="#b7c7b0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="89" y="237" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#23483f">تراز کف</text><path d="M270,211 L313,237 L313,296 L325,303" stroke="#43859a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#43859a)"/><text x="555" y="215" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#43859a">ارتباط ترازها و طول مسیر</text><path d="M675,349 L693,365 L693,416" stroke="#214f43" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="756" y="320" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#23483f">دیوار حائل</text><rect x="98" y="461" width="18" height="18" rx="8" fill="#d9b29c" stroke="none" stroke-width="2"/><text x="177" y="477" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#23483f">خاک‌برداری</text><rect x="287" y="461" width="18" height="18" rx="8" fill="#e4c578" stroke="none" stroke-width="2"/><text x="360" y="477" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#23483f">خاک‌ریزی</text><rect x="35" y="550" width="830" height="72" rx="8" fill="#edf0e5" stroke="none" stroke-width="2"/><text x="450" y="579" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="21" fill="#23483f">عمق حجم، تراز کف و طول دیوار را با هم مقایسه می‌کنم</text><text x="450" y="607" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#5c7066">در دادهٔ فعلی، حدود ۶۴٪ شبکه شیب ۱۵ تا ۲۵٪ دارد؛ تعداد سکوها هنوز انتخاب نشده است.</text><text x="450" y="640" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#6d7c6e">تصویر مفهومی • بدون مقیاس • جانمایی و ابعاد قطعی نیست</text></svg>