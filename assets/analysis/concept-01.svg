="72" rx="8" fill="#d7e1d0" stroke="#214f43" stroke-width="2"/><path d="M555,332 H775" stroke="#cc9a43" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M785,335 L825,431" stroke="#43859a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#43859a)"/><text x="678" y="483" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#23483f">عمق استقرار در جهت شیب کمتر شود</text><path d="M436,300 H463" stroke="#cc9a43" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="450" cy="300" r="15" fill="#faf8f0" stroke="#cc9a43" stroke-width="2"/><text x="450" y="308" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="22" fill="#cc9a43">↔</text><rect x="35" y="550" width="830" height="72" rx="8" fill="#edf0e5" stroke="none" stroke-width="2"/><text x="450" y="579" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="21" fill="#23483f">جهت خورشیدی را با مقطع زمین مقایسه می‌کنم</text><text x="450" y="607" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#5c7066">چرخش حجم باید هم‌زمان با نور، اختلاف تراز و دسترسی سنجیده شود.</text><text x="450" y="640" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#6d7c6e">تصویر مفهومی • بدون مقیاس • جانمایی و ابعاد قطعی نیست</text></svg>