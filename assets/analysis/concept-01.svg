<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">جهت‌گیری؛ گفت‌وگوی آفتاب و زمین</title><desc id="desc">دو شماتیک: جبهه‌های شمال و جنوب در حجم شرق–غرب، و امکان چرخش حجم همراه با خطوط تراز فرضی. زاویه و محل استقرار نهایی تعیین نشده‌اند.</desc><defs><marker id="214f43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#214f43"/></marker><marker id="86a18a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#86a18a"/></marker><marker id="cc9a43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#cc9a43"/></marker><marker id="43859a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#43859a"/></marker><marker id="b97154" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b97154"/></marker><marker id="98748d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#98748d"/></marker></defs><rect x="0" y="0" width="900" height="650" rx="0" fill="#faf8f0" stroke="none" stroke-width="2"/><text x="450" y="45" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="28" fill="#23483f">جهت‌گیری؛ گفت‌وگوی آفتاب و زمین</text><text x="450" y="77" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#6d7c6e">دو معیار هم‌زمان برای بررسی یک حجم ساده</text><rect x="35" y="105" width="400" height="405" rx="16" fill="#ffffff" stroke="#dde3d6" stroke-width="2"/><rect x="465" y="105" width="400" height="405" rx="16" fill="#ffffff" stroke="#dde3d6" stroke-width="2"/><text x="235" y="143" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="23" fill="#23483f">خواندن خورشید</text><text x="665" y="143" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="23" fill="#23483f">خواندن زمین</text><circle cx="235" cy="425" r="23" fill="#efd593" stroke="none" stroke-width="2"/><path d="M265.0,425.0 L275.0,425.0" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M256.2,446.2 L263.3,453.3" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M235.0,455.0 L235.0,465.0" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M213.8,446.2 L206.7,453.3" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M205.0,425.0 L195.0,425.0" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M213.8,403.8 L206.7,396.7" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M235.0,395.0 L235.0,385.0" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M256.2,403.8 L263.3,396.7" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M235,384 L235,331" stroke="#cc9a43" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cc9a43)"/><text x="235" y="481" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#23483f">دریافت و کنترل آفتاب جنوب</text><rect x="115" y="244" width="240" height="75" rx="8" fill="#d7e1d0" stroke="#214f43" stroke-width="2"/><path d="M115,319 H355" stroke="#cc9a43" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M115,244 H3