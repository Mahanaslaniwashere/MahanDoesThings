<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">دسترسی و آب؛ سه مسیرِ هماهنگ</title><desc id="desc">شماتیک تفکیک مسیر پیاده از خدمات و هدایت آب بالادست به مسیری جدا از آستانه. محل توقف، شیب مسیر و اتصال زهکش به شبکه نیازمند طراحی و کنترل‌اند.</desc><defs><marker id="214f43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#214f43"/></marker><marker id="86a18a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#86a18a"/></marker><marker id="cc9a43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#cc9a43"/></marker><marker id="43859a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#43859a"/></marker><marker id="b97154" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b97154"/></marker><marker id="98748d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#98748d"/></marker></defs><rect x="0" y="0" width="900" height="650" rx="0" fill="#faf8f0" stroke="none" stroke-width="2"/><text x="450" y="45" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="28" fill="#23483f">دسترسی و آب؛ سه مسیرِ هماهنگ</text><text x="450" y="77" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#6d7c6e">سبز: پیاده  •  نارنجی: خدمات  •  آبی: آب</text><rect x="35" y="105" width="830" height="405" rx="16" fill="#ffffff" stroke="#dde3d6" stroke-width="2"/><rect x="69" y="146" width="105" height="323" rx="20" fill="#d9ddd3" stroke="none" stroke-width="2"/><path d="M121,165 v20" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M121,205 v20" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M121,245 v20" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M121,285 v20" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M121,325 v20" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M121,365 v20" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M121,405 v20" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M121,445 v20" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="122" y="128" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#23483f">معبر</text><rect x="83" y="221" width="64" height="81" rx="8" fill="#e8cd91" stroke="#cc9a43" stroke-width="2"/><circle cx="92" cy="298" r="6" fill="#214f43" stroke="none" stroke-width="2"/><circle cx="138" cy="298" r="6" fill="#214f43" stroke="none" stroke-width="2"/><rect x="263" y="202" width="168" height="127" rx="20" fill="#f0e1bd" stroke="#cc9a43" stroke-width="2"/><text x="347" y="238" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="23" fill="#23483f">انتظار</text><text x="347" y="273" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#23483f">و کنترل ورود</text><rect x="543" y="192" width="266" height="145" rx="16" fill="#d8e4d2" stroke="#214f43" stroke-width="2"/><text x="676" y="234" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="22" fill="#23483f">فضای آموزشی</text><rect x="652" y="299" width="44" height="38" rx="0" fill="#faf8f0" stroke="#214f43" stroke-width="2"/><path d="M168,279 H251" stroke="#214f43" stroke-width="21" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M172,279 H248" stroke="#214f43" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#214f43)"/><path d="M348,330 V366 H674 V344" stroke="#214f43" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M451,366 H610" stroke="#214f43" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#214f43)"/><g transform="translate(473 358.5) scale(0.8888888888888888)"><circle cx="0" cy="-62" r="8" fill="#214f43"/><path d="M-6,-49 Q0,-53 6,-49 L10,-28 Q0,-23 -10,-28 Z" fill="#527b66"/><path d="M-7,-44 L-15,-28 M7,-44 L15,-31" stroke="#214f43" stroke-width="5" stroke-linecap="round"/><path d="M-5,-27 L-7,-3 L-12,-3 M5,-27 L8,-3 L13,-3" fill="none" stroke="#214f43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M177,428 H735 V354" stroke="#cc9a43" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cc9a43)" stroke-dasharray="8 8"/><text x="439" y="472" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#cc9a43">خدمات؛ مسیر یا زمانِ کنترل‌شده</text><path d="M214,167 H826 V464" stroke="#43859a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#43859a)" stroke-dasharray="8 8"/><text x="518" y="150" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#43859a">جمع‌آوری بالادست؛ دور از آستانه</text><circle cx="825" cy="486" r="13" fill="#faf8f0" stroke="#43859a" stroke-width="2"/><text x="825" y="493" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#43859a">؟</text><text x="710" y="498" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="16" fill="#43859a">خروجی نیازمند کنترل</text><rect x="35" y="550" width="830" height="72" rx="8" fill="#edf0e5" stroke="none" stroke-width="2"/><text x="450" y="579" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="21" fill="#23483f">مسیر کودک، خودرو و آب را هم‌زمان هماهنگ می‌کنم</text><text x="450" y="607" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#5c7066">این تصویر منطق ارتباط‌هاست؛ محل دروازه، عرض مسیر و خروجی آب را تعیین نمی‌کند.</text><text x="450" y="640" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#6d7c6e">تصویر مفهومی • بدون مقیاس • جانمایی و ابعاد قطعی نیست</text></svg>