<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">رابطهٔ فضاها؛ آرامش و نظارت</title><desc id="desc">زنجیرهٔ معبر، ورود و انتظار، فضای واسطه و آموزش، با ارتباط دوطرفهٔ آموزش و فضای باز. ابعاد حباب‌ها ظرفیت یا مساحت را نشان نمی‌دهند.</desc><defs><marker id="214f43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#214f43"/></marker><marker id="86a18a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#86a18a"/></marker><marker id="cc9a43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#cc9a43"/></marker><marker id="43859a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#43859a"/></marker><marker id="b97154" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b97154"/></marker><marker id="98748d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#98748d"/></marker></defs><rect x="0" y="0" width="900" height="650" rx="0" fill="#faf8f0" stroke="none" stroke-width="2"/><text x="450" y="45" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="28" fill="#23483f">رابطهٔ فضاها؛ آرامش و نظارت</text><text x="450" y="77" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#6d7c6e">نمودار همجواری عملکردها، نه پلان معماری</text><rect x="35" y="105" width="830" height="405" rx="16" fill="#ffffff" stroke="#dde3d6" stroke-width="2"/><rect x="67" y="170" width="70" height="267" rx="30" fill="#d9ded5" stroke="none" stroke-width="2"/><path d="M102,185 v16" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M102,220 v16" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M102,255 v16" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M102,290 v16" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M102,325 v16" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M102,360 v16" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M102,395 v16" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="103" y="472" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#23483f">معبر</text><rect x="189" y="213" width="145" height="174" rx="28" fill="#efddba" stroke="#cc9a43" stroke-width="2"/><text x="260" y="274" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="24" fill="#23483f">ورود</text><text x="260" y="311" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="22" fill="#23483f">و انتظار</text><rect x="400" y="186" width="125" height="226" rx="25" fill="#e4dce3" stroke="#98748d" stroke-width="2"/><text x="463" y="266" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="22" fill="#23483f">فضای</text><text x="463" y="300" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="22" fill="#23483f">واسطه</text><rect x="603" y="167" width="220" height="150" rx="35" fill="#d6e3d2" stroke="#214f43" stroke-width="2"/><text x="713" y="224" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="22" fill="#23483f">آموزش و تمرکز</text><text x="713" y="266" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="16" fill="#23483f">ارتباط با نور و منظر</text><rect x="603" y="366" width="220" height="104" rx="35" fill="#e8ecd9" stroke="#214f43" stroke-width="2"/><text x="713" y="409" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="22" fill="#23483f">فضای باز</text><text x="713" y="440" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#23483f">تحت نظارت</text><path d="M140,300 H182" stroke="#cc9a43" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cc9a43)"/><path d="M340,300 H393" stroke="#cc9a43" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cc9a43)"/><path d="M533,244 H593" stroke="#214f43" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#214f43)"/><path d="M713,324 V357" stroke="#214f43" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#214f43)"/><path d="M760,356 V324" stroke="#214f43" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#214f43)"/><path d="M160,192 Q176,225 160,251 M150,205 Q160,223 150,239" stroke="#b97154" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="254" y="151" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#b97154">کنترل مواجهه با صدا</text><text x="456" y="457" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="16" fill="#98748d">اداری یا گردش؛ قابل بررسی</text><text x="453" y="489" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#23483f">رابطه‌ها مهم‌اند؛ تعداد و مساحت تعیین نشده‌اند</text><rect x="35" y="550" width="830" height="72" rx="8" fill="#edf0e5" stroke="none" stroke-width="2"/><text x="450" y="579" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="21" fill="#23483f">از لبهٔ شلوغ به فضای آرام، با ارتباطی خوانا</text><text x="450" y="607" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#5c7066">واسطهٔ فضایی باید همراه با نورگیری، تهویه و نظارت سنجیده شود.</text><text x="450" y="640" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#6d7c6e">تصویر مفهومی • بدون مقیاس • جانمایی و ابعاد قطعی نیست</text></svg>