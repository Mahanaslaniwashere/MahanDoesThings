<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">تهویه؛ جریانِ قابل تنظیم</title><desc id="desc">مقطع مفهومی با بازشوهای قابل تنظیم در دو سوی فضای آموزشی و مسیر ورود تا خروج هوا. جهت باد محلی، سرعت داخل کلاس و عملکرد سرمایشی در این تصویر محاسبه نشده‌اند.</desc><defs><marker id="214f43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#214f43"/></marker><marker id="86a18a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#86a18a"/></marker><marker id="cc9a43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#cc9a43"/></marker><marker id="43859a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#43859a"/></marker><marker id="b97154" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b97154"/></marker><marker id="98748d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#98748d"/></marker></defs><rect x="0" y="0" width="900" height="650" rx="0" fill="#faf8f0" stroke="none" stroke-width="2"/><text x="450" y="45" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="28" fill="#23483f">تهویه؛ جریانِ قابل تنظیم</text><text x="450" y="77" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#6d7c6e">پیکان‌ها مسیر مفهومی‌اند؛ نتیجهٔ شبیه‌سازی جریان نیستند</text><rect x="35" y="105" width="830" height="405" rx="16" fill="#ffffff" stroke="#dde3d6" stroke-width="2"/><text x="450" y="148" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="21" fill="#23483f">مسیر هوا فقط با وجود دو پنجره کامل نمی‌شود</text><rect x="218" y="244" width="444" height="192" rx="0" fill="#eef0e6" stroke="none" stroke-width="2"/><path d="M218,435 H662 M218,244 H662" stroke="#214f43" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M218,245 V295 M218,366 V435 M662,244 V276 M662,349 V435" stroke="#214f43" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M218,295 L245,317 L245,368 M662,277 L691,298 L691,350" stroke="#43859a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M84,337 C200,337 230,348 329,334 S521,274 613,305 S733,314 816,283" stroke="#43859a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#43859a)"/><path d="M321,350 C400,364 472,328 532,325" stroke="#43859a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#43859a)"/><g transform="translate(393 434) scale(1.0)"><circle cx="0" cy="-62" r="8" fill="#214f43"/><path d="M-6,-49 Q0,-53 6,-49 L10,-28 Q0,-23 -10,-28 Z" fill="#527b66"/><path d="M-7,-44 L-15,-28 M7,-44 L15,-31" stroke="#214f43" stroke-width="5" stroke-linecap="round"/><path d="M-5,-27 L-7,-3 L-12,-3 M5,-27 L8,-3 L13,-3" fill="none" stroke="#214f43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="480" y="377" width="70" height="12" rx="3" fill="#86a18a" stroke="none" stroke-width="2"/><path d="M490,389 v45 M541,389 v45" stroke="#214f43" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="127" cy="204" r="17" fill="#efd593" stroke="none" stroke-width="2"/><path d="M151.0,204.0 L161.0,204.0" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M144.0,221.0 L151.0,228.0" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M127.0,228.0 L127.0,238.0" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M110.0,221.0 L103.0,228.0" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M103.0,204.0 L93.0,204.0" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M110.0,187.0 L103.0,180.0" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M127.0,180.0 L127.0,170.0" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M144.0,187.0 L151.0,180.0" stroke="#cc9a43" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="129" y="269" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#23483f">هوای بیرون</text><text x="758" y="401" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#43859a">خروج پیوسته</text><text x="449" y="479" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#23483f">بازشو قابل تنظیم + کنترل صدا و کیفیت هوا</text><path d="M210,300 l-16,65" stroke="#cc9a43" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M653,277 l-16,63" stroke="#cc9a43" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="448" y="206" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#cc9a43">کنترل مقدار و مسیر جریان</text><rect x="35" y="550" width="830" height="72" rx="8" fill="#edf0e5" stroke="none" stroke-width="2"/><text x="450" y="579" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="21" fill="#23483f">باد پرتکرار، الزاماً باد مناسبِ استفاده نیست</text><text x="450" y="607" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#5c7066">شرایط بیرون، فصل و عملکرد فضای واقعی تعیین می‌کنند چه زمانی و چقدر باز شود.</text><text x="450" y="640" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#6d7c6e">تصویر مفهومی • بدون مقیاس • جانمایی و ابعاد قطعی نیست</text></svg>