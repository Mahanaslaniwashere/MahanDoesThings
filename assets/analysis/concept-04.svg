<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">حیاط؛ انتخاب میان آفتاب و سایه</title><desc id="desc">تصویر حجمیِ مفهومی از فضای آموزشیِ ناظر به حیاط، دو بخش آفتاب‌گیر و سایه‌دار و درختان جداشده با معبر. این آرایش، جانمایی واقعی در سایت نیست.</desc><defs><marker id="214f43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#214f43"/></marker><marker id="86a18a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#86a18a"/></marker><marker id="cc9a43" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#cc9a43"/></marker><marker id="43859a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#43859a"/></marker><marker id="b97154" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b97154"/></marker><marker id="98748d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#98748d"/></marker></defs><rect x="0" y="0" width="900" height="650" rx="0" fill="#faf8f0" stroke="none" stroke-width="2"/><text x="450" y="45" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="28" fill="#23483f">حیاط؛ انتخاب میان آفتاب و سایه</text><text x="450" y="77" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#6d7c6e">یک رابطهٔ فضایی، بدون تعیین جای حیاط در قطعه</text><rect x="35" y="105" width="830" height="405" rx="16" fill="#ffffff" stroke="#dde3d6" stroke-width="2"/><path d="M100,348 L565,270 L795,405 L300,485 Z" stroke="#214f4